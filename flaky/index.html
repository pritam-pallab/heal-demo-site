<!doctype html><meta charset="utf-8"><title>Flaky</title><body style="font-family:sans-serif;padding:24px"><div id="app"></div><script>fetch("../state.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(s){var a=document.getElementById("app");if(s.winBroken&&/Windows/.test(navigator.userAgent)){a.innerHTML="<h1>Welcome</h1><p>Loading preferences...</p>";}else{a.innerHTML="<h1>Welcome</h1><button id=\"cookies\">Accept Cookies</button><h2 id=\"hello\" hidden>Welcome back</h2>";a.querySelector("button").onclick=function(){document.getElementById("hello").hidden=false};}}).catch(function(){document.getElementById("app").textContent="state unavailable"});</script></body>
